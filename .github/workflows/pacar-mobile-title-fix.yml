name: PACAR mobile title fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pacar-mobile-title-fix.yml'

permissions:
  contents: write

jobs:
  fix-title:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Keep hero title word together on mobile
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          css = '''\n/* PACAR mobile title refinement */\n@media(max-width:600px){ .hero h1 span { white-space: nowrap; } }\n'''
          if '/* PACAR mobile title refinement */' not in s:
              s = s.replace('</style>', css + '  </style>', 1)
              p.write_text(s, encoding='utf-8')
          PY

      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Refine mobile hero title wrapping'
          git push
